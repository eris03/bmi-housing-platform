# Local development stack.
#   docker compose up -d postgres          # database only (run apps with `pnpm dev`)
#   docker compose up -d --build           # database + migrations + API + web
#   docker compose --profile storage up -d # also start MinIO (S3-compatible)
name: bmi-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bmi
      POSTGRES_PASSWORD: bmi
      POSTGRES_DB: bmi_platform
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmi -d bmi_platform"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile, target: build }
    command: ["pnpm", "--filter", "@bmi/api", "prisma:migrate:deploy"]
    environment:
      DATABASE_URL: postgresql://bmi:bmi@postgres:5432/bmi_platform?schema=public
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    environment:
      NODE_ENV: development
      API_PORT: "4000"
      DATABASE_URL: postgresql://bmi:bmi@postgres:5432/bmi_platform?schema=public
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
      CRM_ADAPTER: sandbox
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    profiles: ["storage"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bmi-dev
      MINIO_ROOT_PASSWORD: bmi-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
